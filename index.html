<html lang="en">

    <script>
      // apply a saved theme before the first paint, so dark mode never flashes white
      try { var t = localStorage.getItem("altitude-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
